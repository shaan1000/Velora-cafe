
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact & Reservation — Velora Café</title>
<meta name="description" content="Reserve a table or get in touch with Velora Café.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main>
  <div class="page-top wrap">
    <span class="eyebrow">Contact</span>
    <h1 style="font-size:clamp(2.6rem,7vw,5rem)">Reserve or say hello.</h1>
  </div>

  <section style="padding-top:20px">
    <div class="wrap split" style="align-items:start">

      <div class="rv">
        <div class="ph" role="img" aria-label="Warm and inviting café interior"
             style="--img:url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1200&q=85');min-height:230px;margin-bottom:28px">
        </div>

        <h2 style="margin-bottom:22px">Book a table</h2>
        <form data-form novalidate aria-label="Reservation">
          <div class="row">
            <label>Name<input name="n" required autocomplete="name"><span class="err" aria-live="polite"></span></label>
            <label>Phone<input name="p" type="tel" required autocomplete="tel" placeholder="98765 43210"><span class="err" aria-live="polite"></span></label>
          </div>
          <div class="row">
            <label>Date<input id="date" type="date" required><span class="err" aria-live="polite"></span></label>
            <label>Time<select required><option value="">Select</option><option>8:00 AM</option><option>11:00 AM</option><option>1:00 PM</option><option>5:00 PM</option><option>7:30 PM</option><option>9:00 PM</option></select><span class="err" aria-live="polite"></span></label>
          </div>
          <label>Guests<select required><option value="">Select</option><option>1–2</option><option>3–4</option><option>5–8</option></select><span class="err" aria-live="polite"></span></label>
          <button class="btn" style="background:var(--gold);border-color:var(--gold)">Reserve Table</button>
        </form>
        <div class="ok" tabindex="-1" role="status">Your table is reserved. A confirmation will reach you shortly — see you at Velora.</div>
      </div>

      <div class="rv">
        <div class="ph" role="img" aria-label="Coffee and café table"
             style="--img:url('https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1200&q=85');min-height:230px;margin-bottom:28px">
        </div>

        <h2 style="margin-bottom:22px">Send a message</h2>
        <div>
          <form data-form novalidate aria-label="Contact">
            <label>Name<input required autocomplete="name"><span class="err" aria-live="polite"></span></label>
            <label>Email<input type="email" required autocomplete="email"><span class="err" aria-live="polite"></span></label>
            <label>Message<textarea rows="4" required></textarea><span class="err" aria-live="polite"></span></label>
            <button class="btn">Send</button>
          </form>
          <div class="ok" tabindex="-1" role="status">Thank you — your message is on its way to our team.</div>
        </div>

        <div class="info" style="margin-top:34px">
          <div><b>Address</b>14 Garden Lane, Howrah, West Bengal</div>
          <div><b>Call</b>+91 98765 43210</div>
        </div>
      </div>

    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
